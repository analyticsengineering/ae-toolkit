version: 2

defaults:
  freshness: &standard_freshness
    warn_after:
      count: 12
      period: hour

sources:
  - name: app
    schema: raw_app
    tables:
      - name: orders
        loaded_at_field: _loaded_at
        freshness: *standard_freshness
      - name: customers
        loaded_at_field: _loaded_at
        freshness: *standard_freshness

models:
  - name: stg_orders
    description: Staged orders.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
