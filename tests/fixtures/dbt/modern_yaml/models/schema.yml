version: 2

anchors:
  standard_freshness: &standard_freshness
    warn_after: {count: 12, period: hour}
    error_after: {count: 24, period: hour}
  hourly_overrides: &hourly_overrides
    warn_after: {count: 1, period: hour}
  audit_columns: &audit_columns
    - name: _loaded_at
      description: Warehouse load time.

sources:
  - name: app
    schema: raw_app
    tables:
      - name: orders
        loaded_at_field: _loaded_at
        freshness: *standard_freshness
      - name: customers
        loaded_at_field: _loaded_at
        freshness: *standard_freshness
      - name: events
        loaded_at_field: _loaded_at
        freshness:
          <<: [*hourly_overrides, *standard_freshness]
          error_after: {count: 6, period: hour}

models:
  - name: stg_orders
    description: Staged orders.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: stg_events
    description: Staged events.
    columns: *audit_columns
