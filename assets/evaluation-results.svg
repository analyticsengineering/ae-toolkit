<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AE Toolkit evaluation results</title>
  <desc id="desc">Across two unseen task sets, an AI agent with AE Toolkit missed 40 percent and 38 percent fewer required checks than the same agent alone.</desc>
  <rect width="1200" height="630" rx="32" fill="#0B1220"/>
  <path d="M0 472C208 405 342 555 578 485c211-62 327-232 622-178v323H0Z" fill="#0F766E" opacity=".12"/>
  <g fill="none" stroke="#2DD4BF" opacity=".13">
    <path d="M0 126h1200M0 252h1200M0 378h1200M0 504h1200"/>
    <path d="M240 0v630M480 0v630M720 0v630M960 0v630"/>
  </g>

  <g transform="translate(72 64)">
    <rect width="54" height="54" rx="12" fill="#14B8A6"/>
    <path d="M13 17c0-4 7-7 14-7s14 3 14 7-7 7-14 7-14-3-14-7Zm0 0v10c0 4 7 7 14 7s14-3 14-7V17M13 27v10c0 4 7 7 14 7s14-3 14-7V27" fill="none" stroke="#F8FAFC" stroke-width="3"/>
    <text x="72" y="23" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">AE Toolkit</text>
    <text x="72" y="47" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="15">Paired evaluation on unseen analytics-engineering tasks</text>
  </g>

  <text x="72" y="190" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="750" letter-spacing="-1.5">Fewer required checks missed.</text>
  <text x="72" y="233" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="21">The same agent ran each task with and without AE Toolkit.</text>

  <g transform="translate(72 286)">
    <rect width="504" height="244" rx="22" fill="#111C2E" stroke="#24334A"/>
    <text x="28" y="39" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">HOLDOUT SET A / 320 RUNS</text>
    <text x="28" y="104" fill="#2DD4BF" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800">40% fewer</text>
    <text x="28" y="136" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="18">required checks missed</text>
    <text x="28" y="183" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="15">Agent alone</text>
    <rect x="142" y="169" width="240" height="18" rx="9" fill="#1E293B"/>
    <rect x="142" y="169" width="202" height="18" rx="9" fill="#475569"/>
    <text x="449" y="184" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="end">21.0%</text>
    <text x="28" y="218" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="15">With toolkit</text>
    <rect x="142" y="204" width="240" height="18" rx="9" fill="#1E293B"/>
    <rect x="142" y="204" width="120" height="18" rx="9" fill="#2DD4BF"/>
    <text x="449" y="219" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end">12.5%</text>
  </g>

  <g transform="translate(624 286)">
    <rect width="504" height="244" rx="22" fill="#111C2E" stroke="#24334A"/>
    <text x="28" y="39" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">HOLDOUT SET B / 287 RUNS</text>
    <text x="28" y="104" fill="#2DD4BF" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800">38% fewer</text>
    <text x="28" y="136" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="18">required checks missed</text>
    <text x="28" y="183" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="15">Agent alone</text>
    <rect x="142" y="169" width="240" height="18" rx="9" fill="#1E293B"/>
    <rect x="142" y="169" width="175" height="18" rx="9" fill="#475569"/>
    <text x="449" y="184" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="end">18.2%</text>
    <text x="28" y="218" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="15">With toolkit</text>
    <rect x="142" y="204" width="240" height="18" rx="9" fill="#1E293B"/>
    <rect x="142" y="204" width="108" height="18" rx="9" fill="#2DD4BF"/>
    <text x="449" y="219" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end">11.2%</text>
  </g>

  <text x="72" y="582" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="14">Cursor Composer 2.5 / synthetic repositories / full method and limitations in docs/EVALUATION.md</text>
</svg>
